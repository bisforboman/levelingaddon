belt with the Missile Barrage rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/ability_mage_missilebarrage.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=400588\/missile-barrage\" target=\"_blank\">Gives your Arcane Blast spell a 40% chance, and your Arcane Wrath, Fireball, Frostbolt, and Frostfire Bolt spells a 20% chance to reduce the channeled duration of your next Arcane Missiles spell by 50%, reduce the Mana cost by 100%, and missiles fire every 0.5 sec.<\/a>"},"415948":{"name_enus":"Engrave Belt - Spellfrost Bolt","icon":"inv_misc_desecrated_leatherbelt","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your belt with the Spellfrost Bolt rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_fire_blueflamebolt.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=412532\/spellfrost-bolt\" target=\"_blank\">Launches a bolt of spellfrost at the enemy, causing [(13.828124 + 0.018012 * <!--pl412532:1:60-->60 + 0.044141 * <!--pl412532:1:60-->60 * <!--pl412532:1:60-->60) * 305 \/ 100 * <!--sp11151:0-->1<!--sp11151-->] to [(13.828124 + 0.018012 * <!--pl412532:1:60-->60 + 0.044141 * <!--pl412532:1:60-->60 * <!--pl412532:1:60-->60) * 355 \/ 100 * <!--sp11151:0-->1<!--sp11151-->] Spellfrost damage and slowing movement speed by 40% for 9 sec. This spell will be checked against the lower of the target's Frost and Arcane resists and counts as both Frost and Arcane damage.<\/a>"},"401752":{"name_enus":"Engrave Boots - Brain Freeze","icon":"inv_pants_cloth_02","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your boots with the Brain Freeze rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/ability_mage_brainfreeze.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=400731\/brain-freeze\" target=\"_blank\">Your Frost damage spells with chilling effects have a 20% chance to cause your next Fireball, Spellfrost Bolt, Balefire Bolt, or Frostfire Bolt spell to be instant cast and cost no mana.<\/a>"},"425189":{"name_enus":"Engrave Boots - Chronostatic Preservation","icon":"inv_misc_desecrated_leatherboots","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your boots with the Chronostatic Preservation rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_arcane_arcane02.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=436516\/chronostatic-preservation\" target=\"_blank\"><!--sp443369:0-->Fuses Arcane, Fire, and Frost magic to freeze chronomantic energy into a stored state for later use. You can hold this energy for up to 20 sec before it combusts and expires. When unleashed, heals a friendly target for [(38.258376 + 0.904195 * <!--pl436516:1:60-->60 + 0.161311 * <!--pl436516:1:60-->60 * <!--pl436516:1:60-->60) * 200 \/ 100] to [(38.258376 + 0.904195 * <!--pl436516:1:60-->60 + 0.161311 * <!--pl436516:1:60-->60 * <!--pl436516:1:60-->60) * 300 \/ 100].<br \/><br \/>This spell is considered Arcane, Fire, and Frost for interactions with other spells, talents, and effects.<!--sp443369--><\/a>"},"415934":{"name_enus":"Engrave Boots - Spell Power","icon":"inv_misc_desecrated_leatherboots","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your boots with the Spell Power rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_holy_mindvision.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=412322\/spell-power\" target=\"_blank\">Increases critical strike damage bonus of all spells by 50%.<\/a>"},"429311":{"name_enus":"Engrave Bracers - Balefire Bolt","icon":"inv_misc_desecrated_clothbracer","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your bracers with the Balefire Bolt rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_fire_firebolt.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=428878\/balefire-bolt\" target=\"_blank\">Unleash a reality-distorting burst of raw magic at your enemy, dealing [(13.828124 + 0.018012 * <!--pl428878:1:60-->60 + 0.044141 * <!--pl428878:1:60-->60 * <!--pl428878:1:60-->60) * 280 \/ 100] to [(13.828124 + 0.018012 * <!--pl428878:1:60-->60 + 0.044141 * <!--pl428878:1:60-->60 * <!--pl428878:1:60-->60) * 420 \/ 100] Chimeric damage.<br \/><br \/>Increasing your Balefire Bolt and Pyroblast damage by 20%, decreasing your Spirit by 20%, and stacking up to 5 times for 30 sec. If your Spirit reaches 0, you die.<br \/><br \/>This spell will be checked against the lower of the target's Arcane, Fire, and Frost resists.<\/a>"},"429309":{"name_enus":"Engrave Bracers - Displacement","icon":"inv_misc_desecrated_clothbracer","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your bracers with the Displacement rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/ability_hunter_displacement.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=428861\/displacement\" target=\"_blank\">Teleports back to where you last cast Blink from and resets the cooldown on Blink. Only usable within 10 sec of casting Blink.<\/a>"},"429308":{"name_enus":"Engrave Bracers - Molten Armor","icon":"inv_misc_desecrated_clothbracer","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your bracers with the Molten Armor rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/ability_mage_moltenarmor.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=428741\/molten-armor\" target=\"_blank\">Causes [10 \/ 100 * (13.828124 + 0.018012 * <!--pl428741:1:60-->60 + 0.044141 * <!--pl428741:1:60-->60 * <!--pl428741:1:60-->60)] Fire damage when hit, increases your spell critical strike chance by 5%, and reduces the chance you are critically hit by 5%.  Only one type of Armor spell can be active on the Mage at any time.  Lasts 30 min.<\/a>"},"401761":{"name_enus":"Engrave Bracers - Rewind Time","icon":"inv_misc_desecrated_leatherglove","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your bracers with the Rewind Time rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_holy_borrowedtime.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=401462\/rewind-time\" target=\"_blank\">Your current target with your Temporal Beacon instantly heals all damage taken over the last 5 seconds. Ineffective on targets that did not have a Temporal Beacon 5 seconds ago.<\/a>"},"401759":{"name_enus":"Engrave Chest - Burnout","icon":"inv_chest_cloth_45","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your chest with the Burnout rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/ability_mage_burnout.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=412286\/burnout\" target=\"_blank\">Increases your spell critical strike chance with all spells by 15%, but your non-periodic spell critical strikes now have an additional mana cost of 1% of your base mana.<\/a>"},"415942":{"name_enus":"Engrave Chest - Enlightenment","icon":"inv_misc_desecrated_leatherchest","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your chest or robe with the Enlightenment rune:<br \/><br \/><span class=\"tooltip-inside-icon\" the subject's space-time position. 80% of all Arcane damage done by the caster will be converted to chronomantic healing on each of the caster's current Temporal Beacon targets. This healing is reduced by 50% on self, and also reduced by 80% when damage is done by Arcane spells that damage multiple targets.<\/a><\/a>"},"401722":{"name_enus":"Engrave Cloak - Arcane Barrage","icon":"inv_misc_cape_21","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your cloak with the Arcane Barrage rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/ability_mage_arcanebarrage.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=400610\/arcane-barrage\" target=\"_blank\">Launches several missiles at the enemy target, causing [(13.828124 + 0.018012 * <!--pl400610:1:60-->60 + 0.044141 * <!--pl400610:1:60-->60 * <!--pl400610:1:60-->60) * 358 \/ 100] to [(13.828124 + 0.018012 * <!--pl400610:1:60-->60 + 0.044141 * <!--pl400610:1:60-->60 * <!--pl400610:1:60-->60) * 438 \/ 100] Arcane damage. This spell also has a 50% to trigger Missile Barrage.<\/a>"},"440858":{"name_enus":"Engrave Cloak - Frozen Orb","icon":"inv_misc_cape_20","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your cloak with the Frozen Orb<br \/>rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_frost_frozencore.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=440802\/frozen-orb\" target=\"_blank\">Launches an orb of swirling ice which rapidly moves forward over 16 sec. While it is moving, every 1 sec the orb deals [90 * (13.828124 + 0.018012 * <!--pl440802:1:60-->60 + 0.044141 * <!--pl440802:1:60-->60 * <!--pl440802:1:60-->60) \/ 100 * <!--sp11151:0-->1<!--sp11151-->] Frost Damage and applies a Chill for 30% movement speed reduction to all enemies it passes through. The first time it damages an enemy, its movement will slow and it will have a 100% chance to trigger the Fingers of Frost rune.<\/a>"},"401764":{"name_enus":"Engrave Cloak - Overheat","icon":"inv_misc_cape_21","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your cloak with the Overheat rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_fire_flameshock.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=400615\/overheat\" target=\"_blank\">Fire Blast will always deal a critical strike, can be cast while casting another spell, and is not affected by the global cooldown, but its cooldown is increased to 15 sec.<\/a>"},"401757":{"name_enus":"Engrave Gloves - Arcane Blast","icon":"inv_misc_desecrated_leatherglove","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your gloves with the Arcane Blast rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_arcane_blast.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=400574\/arcane-blast\" target=\"_blank\">Blasts the target with energy, dealing <!--ppl20:28:32:50-->34 to 38 Arcane damage. Each time you cast Arcane Blast, you gain 12% of your Intellect as Spell Damage and the mana cost of Arcane Blast is increased by 100%. Effect stacks up to 4 times and lasts 18 sec from time of initial application.<\/a>"},"401760":{"name_enus":"Engrave Gloves - Ice Lance","icon":"inv_misc_desecrated_leatherglove","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your gloves with the Ice Lance rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_frost_frostblast.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=400640\/ice-lance\" target=\"_blank\">Deals <!--ppl28:32:36:40-->35 to 41 Frost damage to an enemy target. Deals 300% increased damage to Frozen targets.<\/a>"},"415936":{"name_enus":"Engrave Gloves - Living Bomb","icon":"inv_misc_desecrated_leatherglove","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your gloves with the Living Bomb rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/ability_mage_livingbomb.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=400613\/living-bomb\" target=\"_blank\">The target becomes a Living Bomb, taking [(13.828124 + 0.018012 * <!--pl400613:1:60-->60 + 0.044141 * <!--pl400613:1:60-->60 * <!--pl400613:1:60-->60) * 85 \/ 100 * 4] Fire damage over 12 sec.  After 12 sec or when the spell is dispelled, the target explodes dealing [(13.828124 + 0.018012 * <!--pl400613:1:60-->60 + 0.044141 * <!--pl400613:1:60-->60 * <!--pl400613:1:60-->60) * 171 \/ 100] Fire damage to all enemies within 10 yards.<br \/><br \/>Living Bomb benefits from all talents and effects that trigger from or modify Scorch.<\/a>"},"401754":{"name_enus":"Engrave Helm - Advanced Warding","icon":"inv_misc_desecrated_leatherhelm","screenshot":{},"displayName":"","skillcategory":7,"rank_enus":"","description_enus":"Engrave your helm with the Advanced Warding rune:<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_arcane_arcaneresilience.jpg)\"><\/span><br \/><a href=\"\/forever\/spell=412115\/advanced-warding\" target=\"_blank\">Your Mana Shield, Frost Ward, and Fire Ward spells can now be cast on any friendly target and absorb 100% increased damage, with Mana Shield consuming 50% less mana per damage absorbed. Additionally, your Remove Lesser Curse is replaced with Remove Greater Curse.<br \/><br \/><span class=\"tooltip-inside-icon\" style=\"background-image: url(\/\/wow.zamimg.com\/images\/wow\/icons\/small\/spell_holy_removecurs
